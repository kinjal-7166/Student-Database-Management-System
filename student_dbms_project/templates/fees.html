<!DOCTYPE html>
<html>
<head>
<title>Fees</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<h2>Fees</h2>

<div class="mb-3">
  <a href="/" class="btn btn-secondary">⬅ Back to Home</a>
</div>

<form method="POST" action="/add_fee" class="mb-3">

<input name="student_id" class="form-control mb-2" placeholder="Student ID">
<input name="amount" class="form-control mb-2" placeholder="Amount">
<input name="status" class="form-control mb-2" placeholder="Paid / Pending">
<input name="date" type="date" class="form-control mb-2">

<button class="btn btn-danger">Add</button>

</form>

<table class="table table-bordered">

<tr>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
</tr>

{% for r in records %}
<tr>
<td>{{r[0]}}</td>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Students</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<h2>Students</h2>

<div class="mb-3">
  <a href="/" class="btn btn-secondary">⬅ Back to Home</a>
</div>

<form method="POST" action="/search" class="mb-3">
<input name="keyword" placeholder="Search Student Name">
<button class="btn btn-primary">Search</button>
</form>

<a href="/add_student" class="btn btn-success mb-3">Add Student</a>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Course</th>
<th>Action</th>
</tr>

{% for s in students %}
<tr>
<td>{{s[0]}}</td>
<td>{{s[1]}}</td>
<td>{{s[2]}}</td>
<td>{{s[5]}}</td>
<td>
<a href="/edit_student/{{s[0]}}" class="btn btn-warning btn-sm">Edit</a>  
<a href="/delete_student/{{s[0]}}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
{% endfor %}

</table>

</body>
</html>

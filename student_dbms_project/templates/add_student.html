<!DOCTYPE html>
<html>
<head>
<title>Add Student</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<h2>Add Student</h2>

<div class="mb-3">
  <a href="/students" class="btn btn-secondary">⬅ Back to Students</a>
</div>

<form method="POST">

<input name="name" class="form-control mb-2" placeholder="Name">
<input name="email" class="form-control mb-2" placeholder="Email">
<input name="phone" class="form-control mb-2" placeholder="Phone">
<input name="address" class="form-control mb-2" placeholder="Address">
<input name="course" class="form-control mb-2" placeholder="Course">
<input name="year" class="form-control mb-2" placeholder="Admission Year">

<button class="btn btn-primary">Add Student</button>

</form>

</body>
</html>

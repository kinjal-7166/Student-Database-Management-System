<!DOCTYPE html>
<html>
<head>
<title>Edit Student</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<h2>Edit Student</h2>

<a href="/students" class="btn btn-secondary mb-3">⬅ Back</a>

<form method="POST">

<input name="name" value="{{student[1]}}" class="form-control mb-2">
<input name="email" value="{{student[2]}}" class="form-control mb-2">
<input name="phone" value="{{student[3]}}" class="form-control mb-2">
<input name="address" value="{{student[4]}}" class="form-control mb-2">
<input name="course" value="{{student[5]}}" class="form-control mb-2">
<input name="year" value="{{student[6]}}" class="form-control mb-2">

<button class="btn btn-primary">Update</button>

</form>

</body>
</html>

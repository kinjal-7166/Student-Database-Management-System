<!DOCTYPE html>
<html>
<head>
<title>Results</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<h2>Results</h2>

<div class="mb-3">
  <a href="/" class="btn btn-secondary">⬅ Back to Home</a>
</div>

<form method="POST" action="/add_result" class="mb-3">

<input name="student_id" class="form-control mb-2" placeholder="Student ID">
<input name="subject" class="form-control mb-2" placeholder="Subject">
<input name="marks" class="form-control mb-2" placeholder="Marks">
<input name="grade" class="form-control mb-2" placeholder="Grade">

<button class="btn btn-warning">Add</button>

</form>

<table class="table table-bordered">

<tr>
<th>Name</th>
<th>Subject</th>
<th>Marks</th>
<th>Grade</th>
</tr>

{% for r in records %}
<tr>
<td>{{r[0]}}</td>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
